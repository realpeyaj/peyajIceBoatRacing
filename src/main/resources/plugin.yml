name: IceBoatRacing
version: 3.2.2
main: peyaj.IceBoatRacing
api-version: "1.21"
authors: [peyaj]
description: Multi-arena Ice Boat Racing plugin with GUI, Replays, Parties, and more.
softdepend: [PlaceholderAPI]

commands:
  race:
    description: Main race command
    usage: /race <args>
    permission: race.use
  iceboat:
    description: Opens the main racing menu
    usage: /iceboat
    permission: race.use
  checkpoint:
    description: Respawn at your last checkpoint
    usage: /checkpoint
    aliases: [cp, stuck]
    permission: race.use
  racequit:
    description: Quickly leave a race
    usage: /racequit
    permission: race.use

permissions:
  race.admin:
    description: Admin access to setup, edit, start, stop, and reload races.
    default: op
  race.use:
    description: Access to join and play races.
    default: true
  race.party:
    description: Access to create and join race parties.
    default: true
  race.replay:
    description: Access to list and watch race replays.
    default: true
  race.spectate:
    description: Access to spectate active races.
    default: true
  race.cosmetics:
    description: Access to open and customize cosmetics.
    default: true
  race.trail.*:
    description: Access to all cosmetics trails.
    default: op
    children:
      race.trail.flame: true
      race.trail.hearts: true
      race.trail.notes: true
      race.trail.sparks: true
      race.trail.magic: true
      race.trail.ender: true
      race.trail.rainbow: true
      race.trail.soulfire: true
      race.trail.water: true
      race.trail.snow: true
      race.trail.cherry: true
      race.trail.electric: true
      race.trail.sculk: true
      race.trail.honey: true
      race.trail.lava: true
  race.trail.flame:
    description: Access to flame trail
    default: false
  race.trail.hearts:
    description: Access to hearts trail
    default: false
  race.trail.notes:
    description: Access to music notes trail
    default: false
  race.trail.sparks:
    description: Access to sparks trail
    default: false
  race.trail.magic:
    description: Access to magic trail
    default: false
  race.trail.ender:
    description: Access to ender trail
    default: false
  race.trail.rainbow:
    description: Access to rainbow trail
    default: false
  race.trail.soulfire:
    description: Access to soul fire trail
    default: false
  race.trail.water:
    description: Access to water trail
    default: false
  race.trail.snow:
    description: Access to snow trail
    default: false
  race.trail.cherry:
    description: Access to cherry blossom trail
    default: false
  race.trail.electric:
    description: Access to electric trail
    default: false
  race.trail.sculk:
    description: Access to sculk trail
    default: false
  race.trail.honey:
    description: Access to honey trail
    default: false
  race.trail.lava:
    description: Access to lava trail
    default: false
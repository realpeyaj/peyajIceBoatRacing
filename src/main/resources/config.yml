# ================================
# IceBoatRacing Configuration
# ================================

# CORE SETTINGS
settings:
  # Radius for checkpoint detection (in blocks)
  checkpoint-radius: 25.0
  
  # Discord webhook URL for race notifications (leave empty to disable)
  discord-webhook-url: ""

  # Collision mode for races:
  # - DEFAULT: All players and boats are 100% visible. Server-side collision push and rubberbanding are disabled. OpenBoatUtils mod clients pass through boats without client collision.
  # - GHOST: Opponent racers and boats are hidden (ghost mode for solo time trials or ghost qualifying).
  collision-mode: "DEFAULT"

  # Starting cage interior size:
  # - 3: 3x3 interior air space (recommended for smooth 360-degree rotation and steering)
  # - 2: 2x2 interior air space (snug fit, tight turning against walls)
  cage-size: 3

# MUSIC SETTINGS
music:
  enabled: true
  sound-name: "minecraft:coconutmallmariokartwiiostfourone"
  loop-duration-seconds: 180
  volume: 10000.0
  pitch: 1.0

# REPLAY SETTINGS
replay:
  # Enable race replay recording
  enabled: true
  # Maximum replays to keep per arena (oldest are deleted)
  max-per-arena: 1
  # Recording interval in ticks (2 = 10fps, lower = more detail but larger files)
  record-interval-ticks: 2

# PARTY SETTINGS
party:
  # Maximum players in a party
  max-size: 8
  # Invite cooldown in seconds
  invite-cooldown: 30
  # Invite expiry in seconds
  invite-expiry: 60
  # Auto-join party members to arena when leader joins
  auto-join: true

# ELIMINATION MODE
elimination:
  # Sound played when player is eliminated
  elimination-sound: "ENTITY_WITHER_DEATH"
  # Eliminated players become spectators
  spectate-after-elimination: true

# VICTORY CELEBRATIONS
victory:
  # Number of fireworks to spawn on winner
  firework-count: 5
  # Delay between fireworks (in ticks)
  firework-delay: 10
  # Play victory sounds
  sounds-enabled: true
  # Execute commands when a player finishes in the top 3 (Use %player% for the name)
  rewards:
    enabled: false
    # Minimum players required in the race to give rewards (prevents farming in solo time trials)
    min-players: 2
    # 1st Place Commands
    1:
      - "eco give %player% 500"
    # 2nd Place Commands
    2:
      - "eco give %player% 250"
    # 3rd Place Commands
    3:
      - "eco give %player% 100"

# TRAILS SETTINGS
trails:
  # Default trail for new players (NONE, SMOKE, FLAME, etc.)
  default: "SMOKE"
  # Particle spawn rate (higher = more particles, but more lag)
  particle-rate: 3

# DISCORD INTEGRATION
discord:
  # Send race results to webhook
  send-results: true
  # Send race start notifications
  send-starts: true
  # Send new record notifications
  send-records: true
  # Embed color (decimal format, e.g., 5814783 for ice blue)
  embed-color: 5814783

# SPECTATOR SETTINGS
spectator:
  # Default camera mode (FREE_FLY, FOLLOW_LEADER, FOLLOW_PLAYER, CINEMATIC)
  default-mode: "FREE_FLY"
  # Allow spectators to toggle between modes
  allow-mode-switch: true

# TITLES/NAMETAGS
titles:
  # Show title above racers
  show-above-player: true
  # Title thresholds (wins needed)
  rookie: 0        # Default for new players
  newcomer: 1      # 1+ races played
  enthusiast: 10   # 10+ races
  racer: 5         # 5+ wins
  veteran: 10      # 10+ wins
  master: 25       # 25+ wins
  champion: 50     # 50+ wins
  legend: 100      # 100+ wins

# STARTING GRID
starting-grid:
  # Countdown duration in seconds
  countdown-seconds: 5
  # Show traffic light particles
  traffic-light-enabled: true
  # Spawn barrier/cage around boats
  cage-enabled: true

# Note: Arena data is stored in arenas.yml
# Player stats are stored in stats.yml